name: codex-review

on:
  pull_request:
    branches: [dev]
    types: [opened, synchronize, reopened, labeled]

permissions: {}

concurrency:
  group: codex-review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  detect:
    name: codex-review-detect
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      deep: ${{ steps.detect.outputs.deep }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this pull request crosses a breakpoint
        id: detect
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          LABELED: ${{ contains(github.event.pull_request.labels.*.name, 'deep-review') }}
        run: |
          result=$(node scripts/detect-breakpoint.mjs --range "$BASE_SHA...$HEAD_SHA")
          echo "$result"
          verdict=$(echo "$result" | head -n1)
          if [ "$LABELED" = "true" ]; then verdict=true; fi
          # A pull request can edit the detector or its list. Any change under
          # .github or to the detector forces the deep review without consulting
          # them. The workflow itself can still be edited by a pull request, which
          # is why a maintainer reads every pull request that touches .github.
          if git diff --name-only "$BASE_SHA...$HEAD_SHA" | grep -Eq '^(\.github/|scripts/detect-breakpoint)'; then verdict=true; fi
          echo "deep=$verdict" >> "$GITHUB_OUTPUT"

  review:
    name: codex-review
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.deep == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    # The environment holds CODEX_AUTH_JSON, the maintainer's ChatGPT login,
    # behind a required-reviewer rule, so every deep review waits for a click
    # before the secret is reachable. OpenAI advises against this route on a
    # public repository. The maintainer chose it knowingly on 2026-09-04.
    environment: codex-review
    # One deep review at a time across the repository, because every run
    # seeds the same login and Codex may refresh it mid-run.
    concurrency:
      group: codex-subscription
      cancel-in-progress: false
    permissions:
      contents: read
    outputs:
      verdict: ${{ steps.run_codex.outputs.verdict }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - name: Fetch the base and head refs for the diff
        env:
          PR_BASE_REF: ${{ github.event.pull_request.base.ref }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: git fetch --no-tags origin "$PR_BASE_REF" "+refs/pull/$PR_NUMBER/head"

      - name: Seed the Codex home from the subscription login
        id: seed
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          test -n "$CODEX_AUTH_JSON" || { echo "CODEX_AUTH_JSON is empty in the codex-review environment"; exit 1; }
          home="$RUNNER_TEMP/codex-home"
          mkdir -p "$home"
          chmod 700 "$home"
          printf '%s' "$CODEX_AUTH_JSON" > "$home/auth.json"
          chmod 600 "$home/auth.json"
          # Prove the secret is intact without printing a value. A shell that
          # strips quotes on upload leaves a file jq rejects.
          jq -e 'type == "object"' "$home/auth.json" > /dev/null || { echo "CODEX_AUTH_JSON is not a JSON object. Re-upload it from a shell that keeps the quotes."; exit 1; }
          echo "auth keys: $(jq -r 'keys | join(",")' "$home/auth.json"), auth_mode: $(jq -r '.auth_mode // "unset"' "$home/auth.json")"
          printf 'cli_auth_credentials_store = "file"\nmodel_reasoning_effort = "high"\n' > "$home/config.toml"
          sha256sum "$home/auth.json" | cut -d' ' -f1 > "$RUNNER_TEMP/auth.before"
          echo "home=$home" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      # openai/codex-action needs an API key for its prompt path, so the CLI
      # runs directly. @openai/codex 0.153.2, Apache-2.0, SLSA provenance on
      # npm, checked 2026-09-04. The model is the subscription's default.
      - name: Run Codex on this pull request's diff
        id: run_codex
        env:
          CODEX_HOME: ${{ steps.seed.outputs.home }}
        run: |
          corepack enable
          corepack prepare pnpm@11.9.0 --activate
          # Ubuntu's user-namespace restriction prevents bwrap startup here.
          # The pinned CLI supports equivalent read-only enforcement via Landlock.
          pnpm dlx @openai/codex@0.153.2 \
            -c use_legacy_landlock=true -c 'sandbox_mode="read-only"' sandbox -- \
            sh -c 'cat AGENTS.md > /dev/null && if probe=$(mktemp "$PWD/.review-write-probe.XXXXXX"); then rm -- "$probe"; echo "Sandbox allowed a workspace write"; exit 1; else echo "Sandbox read passed; workspace write denied"; fi'
          # Record effective tool flags without printing configuration or auth.
          pnpm dlx @openai/codex@0.153.2 -c use_legacy_landlock=true features list |
            awk '$1 == "shell_tool" || $1 == "unified_exec" || $1 == "use_legacy_landlock"' || echo "Tool feature diagnostics unavailable"
          set +e
          pnpm dlx @openai/codex@0.153.2 -c use_legacy_landlock=true exec \
            --sandbox read-only --ephemeral --ignore-rules --skip-git-repo-check --color never --json \
            --output-schema .github/codex/review-schema.json \
            --output-last-message "$RUNNER_TEMP/verdict.json" \
            - < .github/codex/review-prompt.md | tee "$RUNNER_TEMP/review-events.jsonl"
          codex_status=${PIPESTATUS[0]}
          set -e
          # Export even malformed output so the gate can explain the failure.
          touch "$RUNNER_TEMP/verdict.json"
          delimiter="CODEX_VERDICT_$(cat /proc/sys/kernel/random/uuid)"
          {
            echo "verdict<<$delimiter"
            cat "$RUNNER_TEMP/verdict.json"
            echo
            echo "$delimiter"
          } >> "$GITHUB_OUTPUT"
          test -s "$RUNNER_TEMP/verdict.json" || { echo "Codex wrote no verdict"; exit 1; }
          exit "$codex_status"

      - name: Say whether the login refreshed itself
        if: always()
        env:
          HOME_DIR: ${{ steps.seed.outputs.home }}
        run: |
          after=$(sha256sum "$HOME_DIR/auth.json" | cut -d' ' -f1)
          if [ "$after" != "$(cat "$RUNNER_TEMP/auth.before")" ]; then
            echo "::warning::Codex refreshed the login during this run. The CODEX_AUTH_JSON secret now holds stale tokens. Re-upload it from the maintainer's machine before the next deep review."
          else
            echo "login unchanged"
          fi
          rm -rf "$HOME_DIR"

  gate:
    name: codex-review-gate
    runs-on: ubuntu-latest
    needs: [detect, review]
    # always() keeps this job from being skipped when the review job fails,
    # since a skipped required check counts as passing.
    if: always() && needs.detect.outputs.deep == 'true' && github.event.pull_request.head.repo.full_name == github.repository
    permissions:
      # Required to check out the tested gate. This repository is public.
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/pull/${{ github.event.pull_request.number }}/merge
          persist-credentials: false

      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: 22

      - name: Post the review as a comment
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        env:
          CODEX_VERDICT: ${{ needs.review.outputs.verdict }}
        with:
          github-token: ${{ github.token }}
          script: |
            // Keep this token-bearing action self-contained. Never import code
            // from the PR checkout into a process holding a write token.
            const raw = process.env.CODEX_VERDICT || '';
            const escapeHtml = text => text.replaceAll('&', '&amp;').replaceAll('<', '&lt;').replaceAll('>', '&gt;');
            let summary = 'The reviewer returned no usable justification. Read the raw response and gate errors.';
            try {
              const value = JSON.parse(raw);
              if (typeof value?.summary === 'string' && value.summary.trim()) summary = value.summary;
            } catch {}
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: `## Codex deep review response\n\n${escapeHtml(summary)}\n\n<details><summary>Raw last response</summary>\n<pre>${escapeHtml(raw)}</pre>\n</details>`,
            });

      - name: Enforce review verdict
        if: always()
        env:
          CODEX_VERDICT: ${{ needs.review.outputs.verdict }}
          REVIEW_RESULT: ${{ needs.review.result }}
        run: |
          printf '%s' "$CODEX_VERDICT" > verdict.json
          # Changing enforcement requires a workflow edit and human review.
          # Verify both policy inputs before executing code from this checkout.
          printf '%s\n' \
            'a2cc38d0769540599ae8a99433e05ae124f5a90ffa57f26bead863879739313d  scripts/check-review-verdict.mjs' \
            '6e335c81e3016f59c201aefb37150433d5594208038cf4d24e303f42548b0722  .github/codex/review-schema.json' |
            sha256sum --check --strict
          node scripts/check-review-verdict.mjs verdict.json
          echo "review job: $REVIEW_RESULT"
          test "$REVIEW_RESULT" = "success"

  fork-guard:
    name: codex-review-fork-guard
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.deep == 'true' && github.event.pull_request.head.repo.full_name != github.repository
    steps:
      - name: Refuse a fork pull request that crosses a breakpoint
        run: |
          echo "This pull request crosses a breakpoint and comes from a fork, so the deep reviewer has no key and did not run."
          echo "A maintainer reviews it by hand and merges with an admin override, or asks the author to open it from a branch."
          exit 1
